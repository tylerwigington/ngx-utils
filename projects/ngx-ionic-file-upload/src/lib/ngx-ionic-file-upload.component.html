<div>
  <div #dropContainer id="drop-area">
    <ion-grid class="drop-container-text">
      <ion-row class="ion-justify-content-center">
        <ion-icon id="uploadIcon" size="large" [name]="config().uploadIcon"> </ion-icon>
      </ion-row>
      <ion-row class="ion-justify-content-center">
        <ion-text id="uploadLabelText">
          {{ config().containerMainLabelText }}
        </ion-text>
      </ion-row>
      @if(config().containerHelpLabelText){
      <ion-row class="ion-justify-content-center">
        <ion-note id="uploadHelpText">
          {{ config().containerHelpLabelText }}
        </ion-note>
      </ion-row>
      }
    </ion-grid>
  </div>
  @if(config().showFileList && files.length){
  <ion-list lines="full" class="ion-no-padding">
    @for(file of files; track file.name; let i = $index){
    <ion-item>
      <ion-icon color="success" slot="start" name="checkmark-circle"></ion-icon>
      <ion-label>
        <span class="file-name">
          {{ file.name }}
        </span>
        <ion-note>{{ file.size | fileSize }}</ion-note>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button color="danger" (click)="removeFile(i)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
    }
  </ion-list>
  }
  <input
    #fileInput
    type="file"
    (change)="fileChange($any($event))"
    [accept]="config().accepts?.join(',')"
    [multiple]="config().multiple"
    hidden />
</div>
